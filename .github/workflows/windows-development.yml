name: Windows development build
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/smoke_desktop.py'
      - 'scripts/smoke_download.py'
      - 'scripts/smoke_session.py'
      - 'scripts/smoke_chrome.py'
      - 'scripts/smoke_empty_states.py'
      - 'scripts/smoke_settings.py'
      - 'scripts/smoke_history_privacy.py'
      - 'scripts/smoke_bookmarks.py'
      - 'scripts/smoke_github_device_mock.py'
      - 'packaging/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-development.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned development build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH='desktop'
          python -m unittest discover -s desktop/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows source browser smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH='desktop'
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS='--disable-gpu'
          python scripts/smoke_desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_download.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_session.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_chrome.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_empty_states.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_settings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_history_privacy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_bookmarks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke_github_device_mock.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build development executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name DOTX --paths desktop desktop/run.py
      - name: Validate x64 binary and WebEngine deployment
        shell: pwsh
        run: |
          @'
          import struct
          from pathlib import Path
          exe = Path('dist/DOTX/DOTX.exe')
          with exe.open('rb') as f:
              assert f.read(2) == b'MZ'
              f.seek(0x3c); offset = struct.unpack('<I', f.read(4))[0]
              f.seek(offset); assert f.read(4) == b'PE\0\0'
              assert struct.unpack('<H', f.read(2))[0] == 0x8664, 'not AMD64'
          assert list(Path('dist/DOTX').rglob('QtWebEngineProcess.exe')), 'WebEngine process missing'
          print('AMD64 executable and WebEngine helper present')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
      - name: Build unsigned installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/dotx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installation, packaged startup and uninstallation
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          $env:QTWEBENGINE_CHROMIUM_FLAGS='--disable-gpu'
          $destination = Join-Path $env:RUNNER_TEMP 'DOTX-Install-Test'
          $installer = Resolve-Path 'artifacts/DOTX-development-setup-x64-unsigned.exe'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$destination") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit code $($install.ExitCode)" }
          $exe = Join-Path $destination 'DOTX.exe'
          if (-not (Test-Path $exe)) { throw 'Installed executable missing' }
          $app = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged startup timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged startup exit code $($app.ExitCode)" }
          $uninstall = Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw 'Executable remains after uninstall' }
      - name: Package portable build and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/DOTX -DestinationPath artifacts/DOTX-development-portable-x64-unsigned.zip
          Get-ChildItem artifacts -File | Where-Object { $_.Name -notlike '*.sha256' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii (Join-Path $_.DirectoryName ($_.Name + '.sha256'))
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DOTX-Windows-development-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
